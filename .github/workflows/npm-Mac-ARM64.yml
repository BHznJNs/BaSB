name: macOS ARM64 Test

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

jobs:
  test-macos-arm64:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "20"
        cache: 'npm'

    - name: Install dependencies
      run: npm install --omit=optional

    - name: Run build and tests
      run: |
        npm run build
        npm test
      env:
        CI: true
